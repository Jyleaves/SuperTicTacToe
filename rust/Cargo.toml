[package]
name = "sttt"
version = "1.1.2"
edition = "2021"

# 零外部依赖：离线可编译，无供应链风险
[dependencies]

[features]
# Exercise the software fallback even on a CPU with accelerated instructions.
portable = []

[lib]
name = "sttt"
# cdylib: 供 Python(pywebview) 桥加载；rlib: 供 sttt-app(Rust 窗口) 直接链接
crate-type = ["cdylib", "rlib"]

# Release profile and platform flags are shared in ../.cargo/config.toml.
